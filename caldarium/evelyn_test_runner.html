<script>
(function () {
  var out = document.getElementById("out");
  function add(line) {
    var span = document.createElement("div");
    if (line.indexOf("[PASS]") === 0) span.className = "pass";
    else if (line.indexOf("[FAIL]") === 0) span.className = "fail";
    else if (line.indexOf("===") >= 0) span.className = "hdr";
    span.textContent = line;
    out.appendChild(span);
  }
  window.__sink = add;
  var suites = [["EvelynTests"], ["EvelynSuiteTests"], ["EvelynDirectorVoiceTests"], ["EvelynFrontierTests"], ["EvelynRoboticsTests"], ["EvelynFuzzTests"], ["EvelynChumsTests"]];
  window.__done = false; window.__totals = { pass: 0, fail: 0 };
  function next(i) {
    if (i >= suites.length) {
      /* the doctor and charter suites print as they load, so count their lines now */
      for (var k = 0; k < window.__lines.length; k++) {
        if (window.__lines[k].indexOf("[PASS]") === 0) window.__totals.pass++;
        else if (window.__lines[k].indexOf("[FAIL]") === 0) window.__totals.fail++;
      }
      window.__done = true; return;
    }
    var S = window[suites[i][0]];
    if (!S) { add("[FAIL] missing suite " + suites[i][0]); window.__totals.fail++; return next(i + 1); }
    S.runAll(function (l) { add(l); }, function (p, f) { window.__totals.pass += p; window.__totals.fail += f; next(i + 1); });
  }
  function run() { out.innerHTML = ""; window.__done = false; window.__totals = { pass: 0, fail: 0 }; next(0); }
  document.getElementById("runBtn").onclick = run;
  /* give the auto-running doctor and charter suites time to print first */
  setTimeout(run, 1500);
})();
</script>
