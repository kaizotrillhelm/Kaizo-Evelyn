<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oasis Micro-Engine: Verlet Physics + Live Neural AI Bots</title>
<style>
  body { font-family: monospace; background: #0f1318; color: #e6edf3; margin: 16px; }
  canvas { border: 1px solid #394656; background: #090c10; display: block; margin: 8px 0; }
  button, input { background: #1b222c; color: #e6edf3; border: 1px solid #394656; padding: 5px 10px; font-family: monospace; }
</style>
</head>
<body>
  <h3>Potato-Hardware Game Lab: Verlet Physics + Live Evolving Neural Bots</h3>
  <div>
    <button id="resetBtn">Reset / Next Generation</button>
    <label>Gravity: <input id="gravRange" type="range" min="0.02" max="0.45" step="0.02" value="0.15"></label>
    <span id="stats"></span>
  </div>
  <canvas id="cv" width="520" height="280"></canvas>
  <div id="info" style="font-size:12px; color:#8b949e">
    Blue swinging rope = Verlet physics constraints. Green dot = goal. Bots (42-weight neural nets) evolve live on CPU to steer around the barrier!
  </div>

<script>
(function () {
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var W = cv.width, H = cv.height;
  var gravity = 0.15;
  document.getElementById("gravRange").oninput = function (e) { gravity = parseFloat(e.target.value); };

  /* --- 1. VERLET PHYSICS ROPE (zero heavy solvers, super CPU-cheap) --- */
  var nodes = [], links = [];
  for (var i = 0; i < 8; i++) {
    nodes.push({ x: 260 + i * 18, y: 30, ox: 260 + i * 18, oy: 30, pinned: i === 0 });
    if (i > 0) links.push({ a: i - 1, b: i, len: 20 });
  }
  function stepPhysics() {
    var i, k, n, l;
    for (i = 0; i < nodes.length; i++) {
      n = nodes[i];
      if (n.pinned) continue;
      var vx = (n.x - n.ox) * 0.99, vy = (n.y - n.oy) * 0.99;
      n.ox = n.x; n.oy = n.y;
      n.x += vx; n.y += vy + gravity;
    }
    for (k = 0; k < 4; k++) {
      for (i = 0; i < links.length; i++) {
        l = links[i];
        var a = nodes[l.a], b = nodes[l.b];
        var dx = b.x - a.x, dy = b.y - a.y;
        var d = Math.sqrt(dx * dx + dy * dy) || 1;
        var diff = (l.len - d) / d;
        if (!a.pinned && !b.pinned) {
          a.x -= dx * 0.5 * diff; a.y -= dy * 0.5 * diff;
          b.x += dx * 0.5 * diff; b.y += dy * 0.5 * diff;
        } else if (a.pinned) {
          b.x += dx * diff; b.y += dy * diff;
        }
      }
    }
  }

  /* --- 2. TINY NEURAL NET GAME AI (4 inputs -> 5 hidden -> 2 thrust outputs) --- */
  var WEIGHT_COUNT = 4 * 5 + 5 * 2; // only 30 floats per bot!
  var goal = { x: 460, y: 140 };
  var wall = { x: 240, y: 80, w: 24, h: 130 };
  var gen = 1, frame = 0, GEN_FRAMES = 220;
  var bots = [];

  function makeBrain(parentW) {
    var w = new Float32Array(WEIGHT_COUNT);
    for (var i = 0; i < WEIGHT_COUNT; i++) {
      w[i] = parentW ? parentW[i] + (Math.random() < 0.25 ? (Math.random() * 2 - 1) * 0.5 : 0) : (Math.random() * 2 - 1);
    }
    return w;
  }

  function spawnGen(bestBrain) {
    bots = [];
    for (var i = 0; i < 24; i++) {
      bots.push({
        x: 50, y: 140, vx: 0, vy: 0, dead: false, bestDist: 1e9,
        w: i === 0 && bestBrain ? new Float32Array(bestBrain) : makeBrain(bestBrain)
      });
    }
    frame = 0;
  }

  function evalBrain(bot) {
    var dxG = (goal.x - bot.x) / W, dyG = (goal.y - bot.y) / H;
    var dxW = (wall.x - bot.x) / W, dyW = ((wall.y + wall.h * 0.5) - bot.y) / H;
    var inp = [dxG, dyG, dxW, dyW];
    var hid = [0, 0, 0, 0, 0], wi = 0, h, i;
    for (h = 0; h < 5; h++) {
      var s = 0;
      for (i = 0; i < 4; i++) s += inp[i] * bot.w[wi++];
      hid[h] = Math.tanh(s);
    }
    var ax = 0, ay = 0;
    for (h = 0; h < 5; h++) ax += hid[h] * bot.w[wi++];
    for (h = 0; h < 5; h++) ay += hid[h] * bot.w[wi++];
    return [Math.tanh(ax) * 0.35, Math.tanh(ay) * 0.35];
  }

  function stepBots() {
    for (var i = 0; i < bots.length; i++) {
      var b = bots[i];
      if (b.dead) continue;
      var act = evalBrain(b);
      b.vx = (b.vx + act[0]) * 0.94;
      b.vy = (b.vy + act[1] + gravity * 0.25) * 0.94;
      b.x += b.vx; b.y += b.vy;
      if (b.x < 4 || b.x > W - 4 || b.y < 4 || b.y > H - 4 ||
         (b.x > wall.x && b.x < wall.x + wall.w && b.y > wall.y && b.y < wall.y + wall.h)) {
        b.dead = true;
      }
      var d = Math.hypot(goal.x - b.x, goal.y - b.y);
      if (d < b.bestDist) b.bestDist = d;
    }
    if (++frame >= GEN_FRAMES) {
      bots.sort(function (a, b) { return (a.bestDist + (a.dead ? 80 : 0)) - (b.bestDist + (b.dead ? 80 : 0)); });
      gen++;
      spawnGen(bots[0].w);
    }
  }

  function loop() {
    stepPhysics();
    stepBots();
    ctx.clearRect(0, 0, W, H);

    /* Draw barrier & goal */
    ctx.fillStyle = "#563d7c"; ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
    ctx.fillStyle = "#58d68d"; ctx.beginPath(); ctx.arc(goal.x, goal.y, 9, 0, Math.PI * 2); ctx.fill();

    /* Draw Verlet rope */
    ctx.strokeStyle = "#58a6ff"; ctx.lineWidth = 2; ctx.beginPath();
    for (var i = 0; i < nodes.length; i++) {
      if (i === 0) ctx.moveTo(nodes[i].x, nodes[i].y); else ctx.lineTo(nodes[i].x, nodes[i].y);
    }
    ctx.stroke();

    /* Draw AI bots */
    for (i = 0; i < bots.length; i++) {
      ctx.fillStyle = i === 0 ? "#ffd580" : (bots[i].dead ? "#444c56" : "#ff7b72");
      ctx.fillRect(bots[i].x - 3, bots[i].y - 3, 6, 6);
    }

    document.getElementById("stats").textContent = " Gen " + gen + " | Frame " + frame + "/" + GEN_FRAMES + " (0.1ms/frame CPU)";
    requestAnimationFrame(loop);
  }

  document.getElementById("resetBtn").onclick = function () { gen = 1; spawnGen(null); };
  spawnGen(null);
  loop();
})();
</script>
</body>
</html>
